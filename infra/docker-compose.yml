# Gravaix – Dienste auf dem VPS
# Starten (auf dem Server, im Ordner infra):  docker compose up -d --build
# Zugangsdaten stehen in infra/.env (Vorlage: .env.example, nie committen).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # SSL-Zertifikate
      - caddy_config:/config
    depends_on:
      - cockpit
      - radicale

  cockpit:
    build: ../apps/cockpit
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cockpit:${POSTGRES_PASSWORD}@postgres:5432/cockpit
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET fehlt in infra/.env}
      BETTER_AUTH_URL: ${COCKPIT_URL:-https://cockpit.gravaix.de}
      # IONOS-Postfach (lesen per IMAP, senden per SMTP). Leer = Mail-Bereich zeigt einen Hinweis.
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.ionos.de}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.ionos.de}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      MAIL_ABSENDER_NAME: ${MAIL_ABSENDER_NAME:-Gravaix Lasermanufaktur}
    depends_on:
      postgres:
        condition: service_healthy

  # Kalender (CalDAV) – von außen nur über Caddy unter cal.gravaix.de erreichbar.
  radicale:
    build: ./radicale
    restart: unless-stopped
    environment:
      RADICALE_USER: ${RADICALE_USER:-celiano}
      RADICALE_PASSWORD: ${RADICALE_PASSWORD:-}
    volumes:
      - radicale_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5232/.web/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Datenbank – nur intern erreichbar, kein Port nach außen.
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in infra/.env}
      POSTGRES_DB: cockpit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  radicale_data:
