<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gravaix Cockpit</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f1ec; --fg:#1d1b18; --muted:#7a7268; --accent:#b8893c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141311; --fg:#f2eee8; --muted:#9a9187; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  main { text-align: center; max-width: 420px; }
  .mark { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 40px; font-weight: 600; letter-spacing: -.02em; margin: 8px 0 12px; }
  p { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fa66b;
         margin-right: 8px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <div class="mark">Gravaix</div>
  <h1>Cockpit</h1>
  <p><span class="dot"></span>Server läuft – das Cockpit ist im Aufbau.</p>
</main>
</body>
</html>
